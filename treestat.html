<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="treestat.css">
     <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"rel="stylesheet"/>
    <title>Developer Tree</title>
</head>
<body>
    <div id="journeypage">
        <h1>Developer Journey</h1>
        <p>Track your progress and learn new skills.</p>
    </div>

    <div class="progress-card">
        <h2>Developer level 1</h2>
        <p>XP: 0/100</p>
    </div>

    <div class="profile">
        <div class="profile-icon">
            <i class="ri-user-line"></i>
        </div>

        <div id="profile-info">
            <h2>Neeraj</h2>
            <p>Developer Level: 9</p>
            <p>Full stack learner</p>
        </div>

        <div class="profile-stats">
            <div>
                <h3>120</h3>
                <p>Challenges completed</p>
            </div>

            <div>
                <h3>4</h3>
                <p>Skills mastered</p>
            </div>

            <div>
                <h3>#1</h3>
                <p>Rank</p>
            </div>
        </div>
    </div>

            <div class="skill-tree">

            <h1>Developer Skill Tree</h1>

            <div class="star-node origin">
                Origin
            </div>

            <div class="connection"></div>

            <div class="horizontal-line"></div>

            <div class="branches">

                <div class="branch">
                    <div class="star-node">
                        Cyber Security
                    </div>

                    <div class="connection"></div>

                    <div class="star-node small">
                        Networking
                    </div>
                </div>

                <div class="branch">

                    <div class="star-node">
                        Programming
                    </div>

                    <div class="connection"></div>


                    <div class="star-node small">
                        C / C++
                    </div>

                </div>



                <div class="branch">

                    <div class="star-node">
                        Web
                    </div>

                    <div class="connection"></div>


                    <div class="star-node small">
                        HTML
                    </div>

                </div>



                <div class="branch">

                    <div class="star-node">
                        DevOps
                    </div>

                    <div class="connection"></div>

                    <div class="star-node small">
                        Linux
                    </div>

                </div>




            </div>

        </div>
</body>
</html>
