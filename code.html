<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="code.css">
    <title>Code Box</title>
</head>
<body>

<div id="codebox">

    <h1>Code Box</h1>

    <select>
        <option>C</option>
        <option>C++</option>
        <option>Python</option>
        <option>Java</option>
    </select>

    <textarea placeholder="Write your code here..."></textarea>

    <button>Run Code</button>

    <div id="output">
        <h2>Output</h2>
        <p>Your output will appear here.</p>
    </div>

</div>

</body>
</html>
